name: Screenshot del manuale
on:
  workflow_dispatch:
  push:
    branches: [docs/privacy]
    paths: [.github/workflows/manual-screenshots.yml]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y xvfb stockfish && sudo ln -sf /usr/games/stockfish /usr/local/bin/stockfish
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries && pnpm typecheck && pnpm test
      - run: pnpm --filter @mtc/app build
      - run: node scripts/copy-assets.mjs && pnpm exec tsup
        working-directory: packages/desktop
      - run: pnpm --filter @mtc/manual exec playwright install-deps chromium
      - run: xvfb-run -a -s "-screen 0 3200x3800x24" pnpm --filter @mtc/manual screenshots
      - name: Commit del risultato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add packages/manual/public/screenshots
          git diff --cached --quiet || git commit -m "Aggiorna gli screenshot del manuale"
          git push
