name: PDF libro di esempio (temporaneo)
on:
  push:
    branches: [tmp/pdf-esempio]
    paths: [.github/workflows/tmp-pdf-esempio.yml]
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mtc/manual exec playwright install-deps chromium
      - run: xvfb-run -a -s "-screen 0 1920x1200x24" pnpm libro-esempio
      - name: Commit dei PDF
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -f esempi/pdf
          git diff --cached --quiet || git commit -m "PDF del libro di esempio (temporaneo)"
          git push
