name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verifica che tag e versioni coincidano
        shell: pwsh
        run: |
          $root = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $desktop = (Get-Content packages/desktop/package.json -Raw | ConvertFrom-Json).version
          if ("v$root" -ne "${{ github.ref_name }}" -or $root -ne $desktop) {
            throw "Versioni incoerenti: tag ${{ github.ref_name }}, radice $root, desktop $desktop"
          }

      - run: pnpm check:boundaries
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @mtc/app build

      - name: Prepara la bozza di release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "maxqua72/mtc-books-releases"
          $found = gh release list --repo $repo --limit 100 --json tagName | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag }
          if (-not $found) {
            gh release create $tag --repo $repo --draft --title $tag.TrimStart('v') --notes "Versione $($tag.TrimStart('v'))"
          }
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Installer e bozza di release
        run: pnpm --filter @mtc/desktop release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      # Il libro di esempio non sta nell'installatore: è un file a parte della release, scaricabile con un link
      - name: Libro di esempio nella bozza di release
        shell: pwsh
        run: gh release upload "${{ github.ref_name }}" esempi/dall-apertura-al-finale.mtcbook --repo maxqua72/mtc-books-releases --clobber
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}