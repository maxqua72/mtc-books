appId: com.mtcbook.writer
productName: MTC Book
directories:
  output: release
files:
  - dist/**
  - "!dist/**/*.map"
  - package.json
extraResources:
  - from: ../app/dist
    to: renderer
  - from: resources/fonts
    to: fonts
  - from: resources/pdfjs
    to: pdfjs
asar: true
artifactName: MTC-Book-Setup-${version}.${ext}
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
fileAssociations:
  - ext: mtcbook
    name: Libro MTC Book
    description: Libro MTC Book
    role: Editor
    icon: icon.ico